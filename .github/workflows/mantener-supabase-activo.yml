name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 12 */3 * *"   # cada 3 días, 9:00 de Misiones
  workflow_dispatch:          # permite correrlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana a la base
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          code=$(curl -s -o respuesta.txt -w "%{http_code}" \
            "${URL%/}/rest/v1/clientes?select=*&limit=1" \
            -H "apikey: $KEY")
          echo "Código HTTP: $code"
          if [ "$code" != "200" ]; then
            echo "Respuesta de Supabase:"
            head -c 300 respuesta.txt
            exit 1
          fi
          echo "Supabase respondió OK"
