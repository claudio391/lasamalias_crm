name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 12 */3 * *"   # cada 3 días, 9:00 de Misiones
  workflow_dispatch:          # permite correrlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana a la base
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/clientes?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -o /dev/null && echo "Supabase respondió OK"
